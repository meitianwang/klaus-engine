[workspace]
resolver = "2"
members = [
    "crates/browser-pipe-napi",
    "crates/cli",
    "crates/core",
    "crates/icu-data",
    "crates/protocol",
    "crates/ripgrep-darwin-arm64",
    "crates/ripgrep-darwin-x64",
    "crates/ripgrep-linux-arm",
    "crates/ripgrep-linux-arm64",
    "crates/ripgrep-linux-ia32",
    "crates/ripgrep-linux-ppc64",
    "crates/ripgrep-linux-riscv64",
    "crates/ripgrep-linux-s390x",
    "crates/ripgrep-linux-x64",
    "crates/ripgrep-win32-arm64",
    "crates/ripgrep-win32-ia32",
    "crates/ripgrep-win32-x64",
    "crates/sandbox-win",
    "crates/sandbox-linux-bwrap",
    "crates/sdk",
    "crates/server",
]

[workspace.package]
# The engine does not carry a version. It is not published, not installed on its
# own, and nothing reads this number to decide anything: a built engine is
# identified by the commit it came from, which the packaging step records in
# `resources/bin/<platform>/manifest.json` as `engineCommit` and refuses to
# label when the tree is dirty. The two things a user can actually hold DO carry
# versions, each on its own: the desktop bundle (`apps/desktop/package.json` in the
# product repo) and the CLI (`crates/cli/Cargo.toml`). A number here would only invite
# a third release cadence that nobody ships.
#
# 0.0.0 is the conventional "unversioned" value, and it is FIXED. The internal
# `=0.0.0` requirements below exist only because `cargo package` refuses a path
# dependency without a version requirement, and staying packageable is a checked
# property (`scripts/check-distribution-packages.mjs`); that script pins the
# literal `=0.0.0`, so raising this number fails the gate on purpose.
version = "0.0.0"
edition = "2021"
license = "MIT"
rust-version = "1.93"

[workspace.dependencies]
# Internal crates: `=0.0.0` is the engine's fixed unversioned value, not a number
# anyone bumps. `klaus-agent-cli` is deliberately absent — nothing depends on the
# CLI crate, so its own version (a real, released one) never has to be mirrored
# here.
klaus-agent-core = { version = "=0.0.0", path = "crates/core" }
klaus-agent-icu-data = { version = "=0.0.0", path = "crates/icu-data" }
klaus-agent-ripgrep-darwin-arm64 = { version = "=0.0.0", path = "crates/ripgrep-darwin-arm64" }
klaus-agent-ripgrep-darwin-x64 = { version = "=0.0.0", path = "crates/ripgrep-darwin-x64" }
klaus-agent-ripgrep-linux-arm = { version = "=0.0.0", path = "crates/ripgrep-linux-arm" }
klaus-agent-ripgrep-linux-arm64 = { version = "=0.0.0", path = "crates/ripgrep-linux-arm64" }
klaus-agent-ripgrep-linux-ia32 = { version = "=0.0.0", path = "crates/ripgrep-linux-ia32" }
klaus-agent-ripgrep-linux-ppc64 = { version = "=0.0.0", path = "crates/ripgrep-linux-ppc64" }
klaus-agent-ripgrep-linux-riscv64 = { version = "=0.0.0", path = "crates/ripgrep-linux-riscv64" }
klaus-agent-ripgrep-linux-s390x = { version = "=0.0.0", path = "crates/ripgrep-linux-s390x" }
klaus-agent-ripgrep-linux-x64 = { version = "=0.0.0", path = "crates/ripgrep-linux-x64" }
klaus-agent-ripgrep-win32-arm64 = { version = "=0.0.0", path = "crates/ripgrep-win32-arm64" }
klaus-agent-ripgrep-win32-ia32 = { version = "=0.0.0", path = "crates/ripgrep-win32-ia32" }
klaus-agent-ripgrep-win32-x64 = { version = "=0.0.0", path = "crates/ripgrep-win32-x64" }
klaus-agent-protocol = { version = "=0.0.0", path = "crates/protocol" }
klaus-agent-sdk = { version = "=0.0.0", path = "crates/sdk" }
klaus-agent-server = { version = "=0.0.0", path = "crates/server" }
klaus-sandbox-win = { version = "=0.0.0", path = "crates/sandbox-win" }
klaus-sandbox-linux-bwrap = { version = "=0.0.0", path = "crates/sandbox-linux-bwrap" }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "=4.5.58", features = ["derive"] }
# Pinned to what clap's own anstream pulls in, so the CLI's TUI and clap's help
# output cannot end up on two versions of the same escape-sequence writer.
anstyle = "1.0"
# clap_builder accepts clap_lex 1.x, but 1.1 raises MSRV to 1.85.
clap_lex = "=1.0.0"
jsonwebtoken = { version = "=9.3.1", default-features = false }
# `rustls-tls-native-roots`, NOT `rustls-tls`: the latter verifies against the
# Mozilla root set that webpki-roots compiles into the binary, so on a network
# that terminates TLS at an inspecting middlebox the enterprise root is invisible
# and every HTTPS leg dies at certificate validation with a bare
# `error sending request for url (...)` — the model provider request included.
# The OS trust store is where an admin-pushed root actually lands. Measured
# against https://chatgpt.com/backend-api/codex/responses behind such a proxy:
#   rustls-tls              error sending request  (chain rejected)
#   rustls-tls-native-roots request completes      (TLS handshake succeeds)
# and identical on a host that is NOT intercepted, so the swap costs nothing
# where interception is absent. A feature swap rather than a call-site change on
# purpose: no reqwest caller should have to know where roots come from.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "preserve_order", "raw_value"] }
indexmap = "2.14.0"
insta = "1.48.0"
sha2 = "0.10"
thiserror = "2"

# 本引擎以 panic 展开（unwind）作为错误回收通道：业务错误通过 panic 抛出，
# 在 turn/工具边界经 catch_unwind 回收为结构化错误。发布构建必须保持 unwind，
# 严禁改为 abort（crates/core/src/lib.rs 中另有编译期守护）。
[profile.release]
panic = "unwind"

# Debug 产物体积由 debuginfo 主导，且只增不减：macOS 默认
# split-debuginfo = "unpacked" 把 DWARF 留在 deps/*.o 里，而 Cargo 对旧指纹
# 产物从不回收。实测 target/debug 曾积到 248 GiB，其中 deps 占 169 GiB、
# 30.2 万个 .o 为主体，且绝大部分是最近一周内不同 feature 组合的重复产物。
#
# line-tables-only 保留回溯所需的文件名与行号——本引擎以 panic 展开作为错误
# 回收通道，回溯可读性不能丢——只去掉变量与类型的 DWARF。
[profile.dev]
debug = "line-tables-only"

# 三方依赖无需任何 debuginfo：断点只会落在本仓库代码里。
# "*" 仅作用于依赖，不含工作区成员，故本仓库 crate 仍走上面的 dev 设置。
[profile.dev.package."*"]
debug = 0

# Cold capability checks hash the complete executable and bundled data.
[profile.dev.package.sha2]
opt-level = 3

# 构建脚本在编译期跑完即弃，其产物不参与调试。
[profile.dev.build-override]
debug = 0
