[package]
name = "klaus-agent-server"
description = "HTTP/WebSocket/SSE server for the agent engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
# Integration tests are one aggregate target, not one per file: `tests/all.rs`
# mounts every file with `#[path]` so the crate is linked once instead of once
# per file. Auto-discovery is off so a new file joins the aggregate instead of
# quietly becoming another target.
autotests = false

[lib]
name = "klaus_agent_server"
path = "src/lib.rs"

[[bin]]
name = "klaus-agent-stdio"
path = "src/bin/klaus-agent-stdio.rs"

[[bin]]
name = "klaus-agent-server"
path = "src/bin/klaus-agent-server.rs"

[[bin]]
name = "klaus-code-mode-host"
path = "src/bin/klaus-code-mode-host.rs"

[dependencies]
klaus-agent-core = { workspace = true }
klaus-agent-protocol = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = "0.8"
thiserror = { workspace = true }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "macros", "time", "net", "io-util", "io-std", "fs"] }
async-trait = "0.1"
async-stream = "0.3"
futures = "0.3"
flate2 = "1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
bytes = "1"
rand = "0.8"
http = "1"
h2 = "0.4"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
# `rustls-tls-native-roots` for the reason spelled out on the workspace reqwest
# entry: baked webpki roots cannot see an inspecting proxy's root, so the model
# provider leg fails at certificate validation.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "http2", "rustls-tls-native-roots"] }
sha2 = "0.10"
hmac = "0.12"
url = "2"
regex = "1"
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.37", features = ["bundled"] }
fs2 = "0.4"

# The Qoder subscription's request signing and its loopback wire translator
# (`app_server::qoder`). Qoder authenticates with an AES-CBC-sealed profile whose
# key is RSA-PKCS1v15-encrypted under a pinned public key, and signs each request
# with an md5 digest, so those three primitives are needed directly. All stable
# releases: the desktop client reached for an `rsa` release candidate only
# because of an unrelated rand_core version, which this crate does not share.
aes = "0.8"
base64 = "0.22"
cbc = { version = "0.1", features = ["alloc"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
md-5 = "0.10"
rsa = "0.9"
ring = "0.17"
urlencoding = "2"

# `fd_limit` raises RLIMIT_NOFILE at startup; get/setrlimit have no std wrapper.
# libc is already in the tree as a transitive dependency, so naming it here adds
# no new crate to the graph.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
klaus-sandbox-win = { workspace = true }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    # The probe reads its own token to report whether it is inside an AppContainer.
    "Win32_Security",
    "Win32_System_Threading",
] }

[dev-dependencies]
# Tests script the engine through the feature-gated test-support surface.
klaus-agent-core = { path = "../core", features = ["testing"] }
# Credential-location tests read a config root, so they need a real directory
# that cleans itself up: the records they stand in for are machine state a test
# must not write into.
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
tokio-util = { version = "0.7", features = ["rt"] }

[[test]]
name = "all"
