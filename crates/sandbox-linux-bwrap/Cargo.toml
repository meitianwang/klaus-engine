[package]
name = "klaus-sandbox-linux-bwrap"
description = "Embedded Linux filesystem namespace launcher"
version.workspace = true
edition.workspace = true
license = "LGPL-2.0-or-later AND Apache-2.0 AND MIT"
rust-version.workspace = true

[build-dependencies]
cc = "1"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
serde = { workspace = true }
serde_json = { workspace = true }
url = "2"
rustix = { version = "=1.1.4", features = ["net"] }

[[bin]]
name = "klaus-sandbox-linux"
path = "src/main.rs"
