[package]
name = "klaus-agent-core"
description = "Headless Rust agent engine core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
# Integration tests are two aggregate targets, not one per file. Cargo turns
# every tests/*.rs into its own target, and each target links the whole crate:
# 54 links of a 160 MB debug binary for every change here. The `all` and
# `all_testing` targets mount the files with `#[path]`, so each file stays where
# it is and one link covers all of them. Auto-discovery is off so a new file
# joins an aggregate instead of quietly becoming a 55th target.
autotests = false

[lib]
name = "klaus_agent_core"
path = "src/lib.rs"

[features]
# Compiles the `testing` module (scripted providers, trace suites, and the
# provider-behavior harness). Downstream crates opt in from dev-dependencies
# so production builds never carry the test-support surface.
testing = []

[dependencies]
# Windows verbatim-path handling. Used by the permission engine to fold `\\?\`
# spellings onto ordinary paths before a path is classified.
dunce = "1.0"
klaus-agent-icu-data = { workspace = true }
sha1 = "0.10"
serde = { workspace = true }
serde_json = { workspace = true }
quick-xml = { version = "0.41.0", features = ["serialize"] }
indexmap = { workspace = true }
ryu-js = "1.0.3"
rusqlite = { version = "0.37", features = ["bundled"] }
thiserror = { workspace = true }
tokio = { version = "=1.52.3", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "process", "io-util", "io-std", "fs", "net", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
futures = "0.3"
async-trait = "0.1"
regex = "1"
similar = "2.7"
scraper = "0.23"
ego-tree = "0.10"
fancy-regex = "0.14"
cel-interpreter = { version = "0.10", features = ["json"] }
rand = "0.8"
chrono = "0.4"
libc = "0.2"
sha2 = "0.10"
hmac = "0.12"
crc32fast = "1"
uuid = { version = "1", features = ["v4"] }
encoding_rs = "0.8"
unicode-normalization = "0.1"
toml_edit = "0.22"
ignore = "0.4"
globset = "0.4"
notify = "8"
opentelemetry = "0.27"
tracing = "0.1"
# `rustls-tls-native-roots` for the reason spelled out on the workspace reqwest
# entry: baked webpki roots cannot see an inspecting proxy's root, so the model
# provider leg fails at certificate validation.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-native-roots"] }
base64 = "0.22"
# Prompt-image decode/encode and indexed PNG quantization.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
color_quant = "1.1"
png = "0.18"
urlencoding = "2"
async-stream = "0.3"
bytes = "1"
flate2 = "1"
zstd = "0.13.3"
tempfile = "3"
fs2 = "0.4"
filetime = "0.2"
tar = "0.4"
md-5 = "0.10"
url = "2"
aes-gcm = "0.10"
v8 = "=147.4.0"
xz2 = { version = "=0.1.7", features = ["static"] }

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
klaus-agent-ripgrep-darwin-arm64 = { workspace = true }

[target.'cfg(all(target_os = "macos", target_arch = "x86_64"))'.dependencies]
klaus-agent-ripgrep-darwin-x64 = { workspace = true }

[target.'cfg(all(target_os = "linux", target_arch = "arm"))'.dependencies]
klaus-agent-ripgrep-linux-arm = { workspace = true }

[target.'cfg(all(target_os = "linux", target_arch = "aarch64"))'.dependencies]
klaus-agent-ripgrep-linux-arm64 = { workspace = true }

[target.'cfg(all(target_os = "linux", target_arch = "x86"))'.dependencies]
klaus-agent-ripgrep-linux-ia32 = { workspace = true }

[target.'cfg(all(target_os = "linux", target_arch = "powerpc64", target_endian = "little"))'.dependencies]
klaus-agent-ripgrep-linux-ppc64 = { workspace = true }

[target.'cfg(all(target_os = "linux", target_arch = "riscv64"))'.dependencies]
klaus-agent-ripgrep-linux-riscv64 = { workspace = true }

[target.'cfg(all(target_os = "linux", target_arch = "s390x"))'.dependencies]
klaus-agent-ripgrep-linux-s390x = { workspace = true }

[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dependencies]
klaus-agent-ripgrep-linux-x64 = { workspace = true }

[target.'cfg(all(target_os = "windows", target_arch = "aarch64"))'.dependencies]
klaus-agent-ripgrep-win32-arm64 = { workspace = true }

[target.'cfg(all(target_os = "windows", target_arch = "x86"))'.dependencies]
klaus-agent-ripgrep-win32-ia32 = { workspace = true }

[target.'cfg(all(target_os = "windows", target_arch = "x86_64"))'.dependencies]
klaus-agent-ripgrep-win32-x64 = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
klaus-sandbox-linux-bwrap = { workspace = true }

[target.'cfg(windows)'.dependencies]
anyhow = "1"
filedescriptor = "0.8.3"
klaus-sandbox-win = { workspace = true }
lazy_static = "1"
log = "0.4"
portable-pty = "0.9.0"
shared_library = "0.1.9"
socket2 = "0.6"
windows-sys = { version = "0.61", features = [
    # RtlGetVersion, for the OS Version line every model request carries.
    "Wdk_System_SystemServices",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }
winapi = { version = "0.3.9", features = [
    "handleapi",
    "minwinbase",
    "processthreadsapi",
    "synchapi",
    "winbase",
    "wincon",
    "winerror",
    "winnt",
] }

[dev-dependencies]
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
insta = { workspace = true }
# The prompt-image regression builds real PNG fixtures to exercise the entry
# gate and the pixel-based estimate.
image = { version = "0.25", default-features = false, features = ["png"] }
# Exercise preparation report handling without Windows native APIs.
klaus-sandbox-win = { workspace = true }
opentelemetry_sdk = { version = "0.27", features = ["metrics", "rt-tokio", "testing"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
syn = { version = "2", features = ["full", "visit"] }
tokio = { version = "=1.52.3", features = ["test-util"] }

# Integration tests are two aggregate targets, not one per file: see the
# `autotests` note in [package].
[[test]]
name = "all"

[[test]]
name = "all_testing"
required-features = ["testing"]
