[package]
name = "klaus-agent-protocol"
description = "Wire protocol for the agent engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
# Integration tests are one aggregate target, not one per file: `tests/all.rs`
# mounts every file with `#[path]` so the crate is linked once instead of once
# per file. Auto-discovery is off so a new file joins the aggregate instead of
# quietly becoming another target.
autotests = false

[lib]
name = "klaus_agent_protocol"
path = "src/lib.rs"

[dependencies]
klaus-agent-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "macros", "time", "io-util"] }
async-trait = "0.1"
futures = "0.3"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
insta = { workspace = true }
# Tests script the engine through the feature-gated test-support surface.
klaus-agent-core = { path = "../core", features = ["testing"] }

[[test]]
name = "all"
