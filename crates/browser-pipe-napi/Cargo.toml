[package]
name = "klaus-browser-pipe-napi"
description = "Windows-only sealed Node-API bridge for Klaus browser broker pipes"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
include = ["src/**"]

[lib]
name = "klaus_browser_pipe"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
sha2.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }
